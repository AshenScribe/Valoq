name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - message-service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run verification, coverage, and packaging
        run: ./gradlew clean check jacocoTestReport installDist --no-daemon --console=plain

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-coverage
          path: ${{ matrix.service }}/build/reports/jacoco/test
          if-no-files-found: warn
          retention-days: 14

      - name: Upload application distribution
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-distribution
          path: ${{ matrix.service }}/build/install/${{ matrix.service }}
          if-no-files-found: error
          retention-days: 14

  container:
    name: Build ${{ matrix.service }} container
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - message-service

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: valoq/${{ matrix.service }}:${{ github.sha }}
