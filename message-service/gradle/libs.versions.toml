[versions]
cassandra-driver = "4.19.3"
groovy = "3.0.5"
jackson-databind = "2.22.2"
junit = "5.7.1"
lettuce = "7.8.0.RELEASE"
mockito = "5.24.0"
netty = "4.2.18.Final"
opentelemetry = "1.49.0"
opentelemetry-prometheus = "1.49.0-alpha"
opentelemetry-runtime-metrics = "1.26.0-alpha"
logback = "1.5.18"
logstash-encoder = "8.1"
slf4j = "2.0.19"
owner = "1.0.12"
testcontainers = "2.0.5"
testcontainers-redis = "2.2.4"

[libraries]
cassandra-driver = { module = "org.apache.cassandra:java-driver-core", version.ref = "cassandra-driver" }

groovy-core = { module = "org.codehaus.groovy:groovy", version.ref = "groovy" }

jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson-databind" }

junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }

lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }

mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-buffer = { module = "io.netty:netty-buffer" }
netty-handler = { module = "io.netty:netty-handler" }
netty-transport = { module = "io.netty:netty-transport" }
netty-common = { module = "io.netty:netty-common" }
netty-codec = { module = "io.netty:netty-codec" }
netty-transport-native-epoll = { module = "io.netty:netty-transport-native-epoll" }

opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "opentelemetry" }
opentelemetry-exporter-prometheus = { module = "io.opentelemetry:opentelemetry-exporter-prometheus", version.ref = "opentelemetry-prometheus" }
opentelemetry-runtime-metrics = { module = "io.opentelemetry.instrumentation:opentelemetry-runtime-metrics", version.ref = "opentelemetry-runtime-metrics" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing", version.ref = "opentelemetry" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logstash-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-encoder" }

owner = { module = "org.aeonbits.owner:owner", version.ref = "owner" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-core = { module = "org.testcontainers:testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-cassandra = { module = "org.testcontainers:testcontainers-cassandra" }
testcontainers-redis = { module = "com.redis:testcontainers-redis", version.ref = "testcontainers-redis" }

[bundles]
testing-suite = ["groovy-core", "junit-jupiter-api", "junit-jupiter-engine", "junit-jupiter-params"]
netty = [
    "netty-buffer",
    "netty-transport",
    "netty-common",
    "netty-codec",
    "netty-transport-native-epoll",
    "netty-handler"
]
slf4j = [
    "slf4j-api"
]
otel = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-exporter-prometheus",
    "opentelemetry-runtime-metrics"
]
