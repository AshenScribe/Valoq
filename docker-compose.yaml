services:
  postgres:
    image: postgres:15
    container_name: valoq-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: valoq
      POSTGRES_USER: valoq
      POSTGRES_PASSWORD: valoq_admin_password
    volumes:
      - ./auth-service/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      postgres
        -c ssl=on
        -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
        -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valoq"]
      interval: 5s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:5.0
    container_name: valoq-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "ValoqCluster"
      CASSANDRA_DC: "datacenter1"
    volumes:
      - ./script/cassandra.yaml:/etc/cassandra/cassandra.yaml
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q 'UN'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  cassandra-init:
    image: cassandra:5.0
    container_name: valoq-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./script/init.cql:/init.cql:ro
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "cqlsh cassandra 9042
      -u cassandra
      -p cassandra
      -f /init.cql"

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: valoq-auth-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: valoq
      DB_USER: valoq
      DB_PASSWORD: valoq_admin_password
      PORT: 8081
      JWT_EXPIRATION_SECONDS: 3600
    depends_on:
      postgres:
        condition: service_healthy

  message-service:
    build:
      context: ./message-service
      dockerfile: Dockerfile
    container_name: valoq-message-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: cassandra
      DB_PORT: 9042
      DB_KEYSPACE: valoq_messages
      DB_LOCAL_DATACENTER: datacenter1
      DB_USER: valoq_message_service
      DB_PASSWORD: message_service_password
      PORT: 8082
      DB_SSL_ENABLED: false
      AUTH_HOST: auth-service
      AUTH_PORT: 8081
    restart: on-failure
    depends_on:
      cassandra-init:
        condition: service_completed_successfully

      auth-service:
        condition: service_started
