services:
  postgres:
    image: postgres:15
    container_name: valoq-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: valoq
      POSTGRES_USER: valoq
      POSTGRES_PASSWORD: valoq_admin_password
    volumes:
      - ./auth-service/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      postgres
        -c ssl=on
        -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
        -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valoq"]
      interval: 5s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:5.0
    container_name: valoq-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "ValoqCluster"
      CASSANDRA_DC: "datacenter1"
    volumes:
      - ./script/cassandra.yaml:/etc/cassandra/cassandra.yaml
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q 'UN'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
      image: redis:8.8.3
      container_name: valoq-redis
      ports:
        - "6379:6379"
      volumes:
        - ./script/redis.conf:/usr/local/etc/redis/redis.conf
      command: ["redis-server", "--protected-mode", "no", "--user", "valoq", "on", ">valoq", "~*", "&*", "+@all"]
      healthcheck:
        test: ["CMD", "redis-cli", "--user", "valoq", "-a", "valoq_redis_password", "ping"]
        interval: 30s
        timeout: 5s
        retries: 3

  cassandra-init:
    image: cassandra:5.0
    container_name: valoq-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./script/init.cql:/init.cql:ro
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "echo 'Waiting for Cassandra CQL port to accept connections...' &&
      until cqlsh cassandra 9042 -u cassandra -p cassandra -e 'describe keyspaces' >/dev/null 2>&1; do
        sleep 2;
      done &&
      echo 'Cassandra is ready. Running initialization script...' &&
      cqlsh cassandra 9042 -u cassandra -p cassandra -f /init.cql"

  otel-collector:
    image: otel/opentelemetry-collector-contrib
    container_name: otel-collector
    command: [ "--config=/etc/otel-config.yaml" ]
    volumes:
      - ./otel-config.yaml:/etc/otel-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      tempo:
        condition: service_started

  tempo:
    image: grafana/tempo:2.7.2
    container_name: valoq-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "9464:9464"
    environment:
      OTEL_SERVICE_NAME: "auth-service"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_LOGS_EXPORTER: "none"
      PROMETHEUS_PORT: "9464"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: valoq
      DB_USER: valoq
      DB_PASSWORD: valoq_admin_password
      PORT: 8081
      JWT_EXPIRATION_SECONDS: 3600
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      alloy:
        condition: service_started
      tempo:
        condition: service_healthy
      grafana:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081; printf \"PING\\n\" >&3; grep -q \"OK\" <&3' || exit 1"
        ]
      interval: 3s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: valoq-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
  loki:
    image: grafana/loki:3.3.2
    container_name: valoq-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  alloy:
    image: grafana/alloy:v1.6.1
    container_name: valoq-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:11.5.2
    container_name: valoq-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./auth-service/observability/grafana:/var/lib/grafana/dashboards:ro
      - ./message-service/observability/grafana:/var/lib/grafana/message-dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  message-service:
    build:
      context: ./message-service
      dockerfile: Dockerfile
    container_name: valoq-message-service
    ports:
      - "8082:8082"
      - "9465:9464"
    environment:
      OTEL_SERVICE_NAME: "message-service"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_LOGS_EXPORTER: "none"
      PROMETHEUS_PORT: "9464"
      DB_HOST: cassandra
      DB_PORT: 9042
      DB_KEYSPACE: valoq_messages
      DB_LOCAL_DATACENTER: datacenter1
      DB_USER: valoq_message_service
      DB_PASSWORD: message_service_password
      PORT: 8082
      DB_SSL_ENABLED: false
      AUTH_HOST: auth-service
      AUTH_PORT: 8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: valoq
      REDIS_PASSWORD: valoq
      REDIS_DATABASE: 0

    restart: on-failure
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 3 bash -c '</dev/tcp/127.0.0.1/8082' || exit 1"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
