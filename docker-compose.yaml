services:
  postgres:
    image: postgres:15
    container_name: valoq-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: valoq
      POSTGRES_USER: valoq
      POSTGRES_PASSWORD: valoq_admin_password
    volumes:
      - ./auth-service/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      postgres
        -c ssl=on
        -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
        -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valoq"]
      interval: 5s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:5.0
    container_name: valoq-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "ValoqCluster"
      CASSANDRA_DC: "datacenter1"
      SSL_VALIDATE: "false"
      MAX_HEAP_SIZE: "1024M"
    volumes:
      - ./message-service/src/main/resources/init.cql:/init.cql:ro
    command:
      - /bin/sh
      - -c
      - |
        sed -i 's/^authenticator: .*/authenticator: PasswordAuthenticator/' /etc/cassandra/cassandra.yaml
        sed -i 's/^authorizer: .*/authorizer: CassandraAuthorizer/' /etc/cassandra/cassandra.yaml

        rm -f /etc/cassandra/keystore.p12
        keytool -genkeypair -alias cassandra -keyalg RSA -keysize 2048 \
          -keystore /etc/cassandra/keystore.p12 -storetype PKCS12 \
          -storepass cassandra -keypass cassandra -dname "CN=localhost" -noprompt

        python3 -c '
        path = "/etc/cassandra/cassandra.yaml"
        with open(path, "r") as f:
            lines = f.readlines()

        new_lines = []
        skip = False
        for line in lines:
            if line.startswith("client_encryption_options:"):
                skip = True
                continue
            if skip and (line.startswith("  ") or line.strip() == ""):
                continue
            skip = False
            new_lines.append(line)

        ssl_block = (
            "client_encryption_options:\n"
            "  enabled: true\n"
            "  optional: false\n"
            "  keystore: /etc/cassandra/keystore.p12\n"
            "  keystore_password: cassandra\n"
            "  require_client_auth: false\n"
        )
        new_lines.append("\n" + ssl_block)

        with open(path, "w") as f:
            f.writelines(new_lines)
        '

        mkdir -p /root/.cassandra
        printf "[ssl]\nvalidate = false\n" > /root/.cassandra/cqlshrc

        # FIX: Background job to execute init.cql once Cassandra is fully ready
        (
          echo "Waiting for Cassandra to accept connections..."
          until cqlsh -u cassandra -p cassandra --ssl -e "describe cluster" > /dev/null 2>&1; do
            sleep 5
          done
          echo "Cassandra is up. Executing init.cql..."
          cqlsh -u cassandra -p cassandra --ssl -f /init.cql
          echo "Database initialization complete."
        ) &

        exec docker-entrypoint.sh cassandra -f
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra --ssl -e 'DESCRIBE KEYSPACE valoq_keyspace' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: valoq-auth-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: valoq
      DB_USER: valoq
      DB_PASSWORD: valoq_admin_password
      PORT: 8081
      JWT_EXPIRATION_SECONDS: 3600
    depends_on:
      postgres:
        condition: service_healthy

  message-service:
    build:
      context: ./message-service
      dockerfile: Dockerfile
    container_name: valoq-message-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: cassandra
      DB_PORT: 9042
      DB_KEYSPACE: valoq_keyspace
      DB_LOCAL_DATACENTER: datacenter1
      DB_USER: cassandra
      DB_PASSWORD: cassandra
      PORT: 8082
      AUTH_HOST: auth-service
      AUTH_PORT: 8081
    restart: on-failure
    depends_on:
      cassandra:
        condition: service_healthy
      auth-service:
        condition: service_started
