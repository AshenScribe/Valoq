import java.security.KeyPairGenerator

plugins {
    id 'java'
    id 'application'
    id 'com.diffplug.spotless' version '7.2.1'
    id 'checkstyle'
}

def targetArch = project.findProperty('targetArch') ?: 'linux-x86_64'
def epollClassifier = (targetArch in ['linux-aarch_64', 'aarch64']) ? 'linux-aarch_64' : 'linux-x86_64'

sourceSets {
    e2eTest {
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    e2eTestImplementation.extendsFrom testImplementation
    e2eTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation platform(libs.netty.bom)
    implementation libs.bundles.netty
    implementation libs.bundles.slf4j

    implementation(variantOf(libs.netty.transport.native.epoll) {
        classifier(epollClassifier)
    })

    testImplementation libs.bundles.testing.suite
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${libs.versions.junit.get()}"
    testRuntimeOnly libs.junit.platform.launcher

    implementation libs.jjwt.api
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson

    implementation libs.snake.yaml
    implementation libs.hikaricp
    runtimeOnly libs.postgresql
    implementation libs.h2.db

    e2eTestImplementation libs.testcontainers.junit
    e2eTestImplementation libs.testcontainers.postgres
    e2eTestImplementation libs.testcontainers.core

    implementation libs.bcrypt

    implementation libs.jackson.databind
}

application {
    mainClass = "Main"
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs(['--enable-native-access=ALL-UNNAMED'])

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = false
        showExceptions = true
        showCauses = true
        showStackTraces = true
        exceptionFormat = 'full'
    }

    afterSuite { desc, result ->
        if (!desc.parent) {
            println "\n[${name}] Summary: ${result.resultType}"
            println "  Passed:  ${result.successfulTestCount}"
            println "  Failed:  ${result.failedTestCount}"
            println "  Skipped: ${result.skippedTestCount}"
            println "  Total:   ${result.testCount}\n"
        }
    }
}

tasks.register('e2eTest', Test) {
    description = 'Runs the end-to-end tests.'
    group = 'verification'

    testClassesDirs = sourceSets.e2eTest.output.classesDirs
    classpath = sourceSets.e2eTest.runtimeClasspath

    shouldRunAfter tasks.named('test')
}

spotless {
    java {
        googleJavaFormat('1.30.0').aosp()
        removeUnusedImports()
        licenseHeaderFile rootProject.file('LICENSE_HEADER')
    }
}

checkstyle {
    toolVersion = '10.26.1'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}

tasks.withType(Checkstyle).configureEach {
    dependsOn 'spotlessApply'
}

tasks.named('check') {
    dependsOn tasks.named('e2eTest')
}

apply from: 'gradle/dev-certs.gradle'

dependencyLocking { lockAllConfigurations() }